name: Test tap-apple-search-ads

on:
  push:
    branches: [main]
    paths:
    - .github/workflows/test.yml
    - tap_apple_search_ads/**
    - tests/**
    - pyproject.toml
    - uv.lock
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Run ruff
      run: |
        uvx ruff@0.17.3 check
        uvx ruff@0.17.3 format --check

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Test with pytest
      env:
        TAP_APPLE_SEARCH_ADS_CLIENT_ID__1227480: ${{ secrets.TAP_APPLE_SEARCH_ADS_CLIENT_ID }}
        TAP_APPLE_SEARCH_ADS_CLIENT_SECRET__1227480: ${{ secrets.TAP_APPLE_SEARCH_ADS_CLIENT_SECRET }}
      run: uv run --locked --managed-python --python ${{ matrix.python-version }} pytest

  test:
    if: always()
    needs: [pytest]
    runs-on: ubuntu-latest
    steps:
    - name: Fail if any pytest leg failed
      if: needs.pytest.result != 'success'
      run: exit 1
