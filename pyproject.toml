[project]
name = "ticketswap-tap-apple-search-ads"
version = "1.5.0"
description = "Singer tap for AppleSearchAds, built with the Meltano Singer SDK."
readme = "README.md"
authors = [{ name = "Tobias Cadee", email = "tobias.cadee@ticketswap.com" }]
keywords = [
    "ELT",
    "AppleSearchAds",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "singer-sdk~=0.54.9",
    "requests~=2.34.2",
]

[project.optional-dependencies]
s3 = [
    "fs-s3fs~=1.1.1",
]

[project.scripts]
tap-apple-search-ads = "tap_apple_search_ads.tap:TapAppleSearchAds.cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "singer-sdk[testing]~=0.54.9",
]

[tool.hatch.build.targets.wheel]
packages = ["tap_apple_search_ads"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[tool.ruff]
src = ["tap_apple_search_ads"]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "ANN101",  # missing-type-self
    "ANN102",  # missing-type-cls
    "COM812",  # missing-trailing-comma
    "CPY001",
    "ISC001",  # single-line-implicit-string-concatenation
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]
known-first-party = ["tap_apple_search_ads"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
